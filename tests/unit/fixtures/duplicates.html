<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Duplicate tags everywhere</title>
    <title>Second title element</title>
    <meta name="description" content="First description." />
    <meta name="description" content="Second description." />
    <meta name="description" content="" />
    <meta property="og:image" content="/images/relative-cover.jpg" />
    <meta property="og:image" content="https://cdn.example.com/second.jpg" />
    <meta property="og:image:url" content="https://cdn.example.com/third.jpg" />
    <meta name="twitter:image:src" content="images/aliased.jpg" />
    <meta name="twitter:card" content="huge_card" />
    <meta name="ROBOTS" content="noindex, follow" />
  </head>
  <body>
    <p>Everything is duplicated.</p>
  </body>
</html>
